# When the release PR from develop into main is merged, a draft GitHub release x.y.z
# is created from that version's section in CHANGES.rst.
name: Release draft

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  release-draft:
    uses: OnroerendErfgoed/shared-workflows/.github/workflows/release-draft.yml@v1
    permissions:
      contents: write