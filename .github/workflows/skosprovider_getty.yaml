name: skosprovider_getty backend tests

on:
  pull_request:
    paths:
      - skosprovider_getty/**
      - tests/**
      - .github/workflows/skosprovider_getty.yaml
      - pyproject.toml
      - lockfiles/requirements*.txt

  push:
    branches:
      - main

permissions: {}

jobs:
  test:
    uses: OnroerendErfgoed/shared-workflows/.github/workflows/python-tests.yml@v1
    permissions:
      contents: read
      pull-requests: write # coverage comment
    with:
      runs-on: ubuntu-latest # public repo: no self-hosted runners
      python-versions: '["3.11", "3.12"]'
      # One lockfile per Python version
      install-command: |
        pip install pip-tools
        pip-sync "lockfiles/requirements-dev-py$PYTHON_VERSION.txt"
        pip install -e .
      lint-command: "" # the old workflow ran no linter
      test-command: pytest --cov=skosprovider_getty --cov-report xml:"$COVERAGE_XML" tests --exitfirst --capture=no -vvv --full-trace
