name: skosprovider_getty backend tests
on:
  pull_request:
    paths:
      - skosprovider_getty/**
      - tests/**
      - .github/workflows/skosprovider_getty.yaml
      - pyproject.toml
      - requirements*.txt

  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # You can test your matrix by printing the current Python version
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install python requirements
        env:
          HATCH_BUILD_NO_HOOKS: true
        working-directory: ./
        run: |
          pip --version
          pip install pip-tools
          pip-sync lockfiles/requirements-dev-py${{ matrix.python-version }}.txt
          pip install -e .

      - name: Python tests
        run: pytest --cov=skosprovider_getty --cov-report xml:${{ runner.temp }}/coverage.xml tests --exitfirst --capture=no -vvv --full-trace

      - name: Get Cover
        if: matrix.python-version == '3.11'
        uses: orgoro/coverage@v3.2
        with:
          coverageFile: ${{ runner.temp }}/coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.8
          thresholdNew: 0.9
          thresholdModified: 0.8
